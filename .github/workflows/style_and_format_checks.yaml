name: Test suite

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Fetch and verify fixture payloads
        run: |
          git lfs pull --include="tests/data/**"
          git -c lfs.fetchexclude="docs/notebooks/data/**" lfs fsck
          mkdir -p .test-work test-reports
          echo "TMPDIR=$PWD/.test-work" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            test_requirements.txt
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libxml2-dev
      - name: Install package and tests
        run: |
          python -m pip install "pip<25.1" "setuptools<76" wheel
          python -m pip install -e . -r test_requirements.txt
          python -m pip check
          python -m pip freeze > test-reports/environment.txt
      - name: Smoke-test native graph compatibility
        run: python scripts/check_native_graph.py
      - name: Run full default suite
        run: |
          python -m pytest --basetemp=.test-work/pytest \
            --junitxml=test-reports/junit.xml \
            --cov=transcriptomic_clustering --cov-config=.coveragerc \
            --cov-report=term --cov-report=xml:test-reports/coverage.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python }}
          path: test-reports/
          if-no-files-found: warn
